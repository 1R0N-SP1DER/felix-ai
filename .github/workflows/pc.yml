name: PC build

on:
  push:
    branches: [main, PC]
    paths: ["pc/**", ".github/workflows/pc.yml"]
  pull_request:
    paths: ["pc/**", ".github/workflows/pc.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The installer is valid shell
        run: bash -n install.sh

      - name: Install the one crypto dependency
        run: pip install cryptography

      - name: Logic tests
        run: python -m unittest discover -s . -t . -p "test_*.py" -v

      - name: Install Qt and the system libraries it needs offscreen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 fonts-dejavu-core
          pip install "PySide6-Essentials>=6.6" cryptography

      - name: Draw both windows offscreen and take screenshots
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          FAZE_DEMO: "1"
        run: |
          mkdir -p shots
          FAZE_SCREENSHOT=shots/desktop.png timeout 90 python -c "from faze_pc.ui.app import run_ui; import sys; sys.exit(run_ui(False))"
          FAZE_SCREENSHOT=shots/floating.png timeout 90 python -c "from faze_pc.ui.app import run_ui; import sys; sys.exit(run_ui(True))"
          FAZE_DEMO_POPUP=devices FAZE_SCREENSHOT=shots/devices.png timeout 90 python -c "from faze_pc.ui.app import run_ui; import sys; sys.exit(run_ui(False))"
          FAZE_DEMO_POPUP=mirror FAZE_SCREENSHOT=shots/mirror.png timeout 90 python -c "from faze_pc.ui.app import run_ui; import sys; sys.exit(run_ui(False))"
          ls -l shots

      - name: The phone window starts as its own program (it must still be running after 6 seconds)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/run" XDG_CONFIG_HOME="$RUNNER_TEMP/cfg" XDG_DATA_HOME="$RUNNER_TEMP/data"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          set +e
          timeout 6 python -m faze_pc.cli --mirror
          code=$?
          pkill -f faze_pc.daemon
          test "$code" = 124

      - name: Print the screenshots into the log, so they can be read without downloading
        run: |
          for f in shots/*.png; do echo "BEGIN64 $f"; base64 -w0 "$f"; echo; echo "END64 $f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: pc-screenshots
          path: pc/shots/*.png
